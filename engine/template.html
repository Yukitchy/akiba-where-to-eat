<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="{{TITLE}}"><meta property="og:description" content="{{DESC}}"><meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 fill=%22%23{{ACCENT_HEX}}%22/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#F1EFEA;--ink:#121212;--ac:#{{ACCENT_HEX}};--mu:#5D5A54;--ok:#1F8A4C}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,"Noto Sans JP",sans-serif}
.col{max-width:640px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;justify-content:space-between;font-weight:800;font-size:13px;letter-spacing:.14em;padding:18px 0 8px;border-bottom:4px solid var(--ink);text-transform:uppercase}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.nav a,.nav span{font:800 12px/1 Archivo,sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:10px 12px;border:2px solid var(--ink);color:var(--ink);text-decoration:none}
.nav span{background:var(--ink);color:#fff}
h1{margin:14px 0 10px;font:900 clamp(40px,12vw,64px)/.95 Archivo,"Noto Sans JP",sans-serif;font-stretch:62%;text-transform:uppercase;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--ac)}
.lead{margin:0 0 16px;color:var(--mu)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);margin:0 0 6px}
.bar b{font:800 13px/1 Archivo,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.grp{margin:26px 0 4px;padding:10px 0;border-top:4px solid var(--ink);border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;font:900 18px/1 Archivo,sans-serif;font-stretch:62%;letter-spacing:.06em;text-transform:uppercase}
.grp span{font-size:13px;color:var(--ac)}
.gp{margin:0 0 12px;font-size:14px;color:var(--mu)}
.sw{position:relative;width:44px;height:24px;flex:none;border:0;background:#c9c5bc;cursor:pointer;padding:0}.sw:after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff}.sw[aria-checked=true]{background:var(--ac)}.sw[aria-checked=true]:after{left:23px}
.now{margin:0 0 18px;font-size:14px;font-weight:700;color:var(--ac)}
.card{position:relative;background:#fff;border-top:4px solid var(--ink);padding:16px 16px 14px;margin:0 0 14px}
.card.closed{opacity:.62}
body.filter .card.closed{display:none}
.st{position:absolute;right:12px;top:14px;font:800 11px/1 Archivo,sans-serif;letter-spacing:.08em;padding:5px 7px;background:#c9c5bc;color:#3a3833}
.st.o{background:var(--ok);color:#fff}.st.u{background:#fff;border:1px solid #c9c5bc;color:var(--mu)}
.no{font:900 13px/1 Archivo,sans-serif;letter-spacing:.1em;color:var(--ac)}
h2{margin:4px 70px 2px 0;font:900 26px/1.05 Archivo,"Noto Sans JP",sans-serif;font-stretch:62%;text-transform:uppercase}
.jp{margin:0 0 10px;font:900 20px/1.3 "Noto Sans JP",sans-serif;background:var(--ink);color:#fff;display:inline-block;padding:4px 10px}
.hint{display:block;margin:0 0 10px;font-size:12px;color:var(--mu)}
.card p{margin:0 0 10px}
dl{margin:0 0 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
dt{font-weight:800;color:var(--mu);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}dd{margin:0}
.map{display:inline-block;font:800 13px/1 Archivo,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--ac);padding:12px 14px;text-decoration:none}
.foot{margin-top:24px;padding-top:12px;border-top:2px solid var(--ink);font-size:13px;color:var(--mu)}
.foot p{margin:0 0 8px}
</style></head><body><div class="col">
<div class="top"><span>Akihabara</span><span>{{TOPTAG}}</span></div>
<div class="nav">{{NAV}}</div>
<h1>{{H1}}</h1>
<p class="lead">{{LEAD}}</p>
<div class="bar"><b>Only what's open now</b><button class="sw" id="sw" role="switch" aria-checked="false" aria-label="Show only places open now"></button></div>
<p class="now" id="now"></p>
<div id="list"></div>
<div class="foot">{{FOOT}}</div>
</div>
<script>
const D=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const S={{DATA}};
const m=t=>{const [h,n]=t.split(':').map(Number);return h*60+n};
function tokyo(){const o={};new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',hour12:false,weekday:'short',hour:'2-digit',minute:'2-digit'}).formatToParts(new Date()).forEach(x=>o[x.type]=x.value);return{d:D.indexOf(o.weekday),m:(parseInt(o.hour)%24)*60+parseInt(o.minute)}}
function state(s,n){if(!s.hours)return'u';return s.hours.some(r=>r.d.includes(n.d)&&n.m>=m(r.o)&&n.m<m(r.c))?'o':'c'}
const q=encodeURIComponent;let last='',k=0;
document.getElementById('list').innerHTML=S.map(s=>{let g='';if(s.group!==last){last=s.group;g=`<div class="grp">${s.group}<span>${s.groupNote||''}</span></div>`}k++;
return g+`<article class="card" data-id="${s.id}"><span class="st"></span>
<div class="no">${String(k).padStart(2,'0')}</div><h2>${s.en}</h2>
<div class="jp" lang="ja">${s.jp}</div><span class="hint">Show this name at the door</span>
<p>${s.note}</p>
<dl><dt>Area</dt><dd>${s.area}</dd><dt>Hours</dt><dd>${s.txt}</dd><dt>Closed</dt><dd>${s.closed}</dd><dt>Pay</dt><dd>${s.pay}</dd></dl>
<a class="map" href="https://www.google.com/maps/search/?api=1&query=${q(s.jp+' '+s.addr)}" target="_blank" rel="noopener">Open in Google Maps</a></article>`}).join('');
function refresh(){const n=tokyo(),open=[];S.forEach(s=>{const e=document.querySelector('[data-id="'+s.id+'"]'),st=state(s,n);e.classList.toggle('closed',st==='c');const b=e.querySelector('.st');b.className='st '+st;b.textContent=st==='o'?'OPEN':st==='c'?'CLOSED':'CHECK';if(st==='o')open.push(s.en)});
document.getElementById('now').textContent=open.length?'Open right now: '+open.join(', '):'Nothing on this list is open right now.'}
const sw=document.getElementById('sw');sw.onclick=()=>{const on=sw.getAttribute('aria-checked')!=='true';sw.setAttribute('aria-checked',on);document.body.classList.toggle('filter',on)};
refresh();setInterval(refresh,60000);
</script></body></html>
